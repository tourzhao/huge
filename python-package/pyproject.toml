[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.11", "numpy>=1.23"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhuge"
version = "2.0.0"
description = "Native Python package for high-dimensional undirected graph estimation"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Tuo Zhao", email = "tourzhao@gatech.edu" }
]
keywords = ["graphical-model", "graphical-lasso", "sparse", "statistics", "native-python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
]

[project.optional-dependencies]
# runtime lists the core deps explicitly so `pip install "pyhuge[runtime]"` is meaningful
runtime = [
  "numpy>=1.23",
  "scipy>=1.9",
]
viz = [
  "matplotlib>=3.8",
  "networkx>=3.2",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]
test = [
  "pytest>=7.4",
]
dev = [
  "pytest>=7.4",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "build>=1.2",
  "twine>=5.1",
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]
release = [
  "build>=1.2",
  "twine>=5.1",
  "cibuildwheel==4.1.0",
]

[project.scripts]
pyhuge-doctor = "pyhuge.doctor:main"

[project.urls]
Homepage = "https://github.com/Gatech-Flash/huge"
Repository = "https://github.com/Gatech-Flash/huge"
Documentation = "https://gatech-flash.github.io/huge/"
Issues = "https://github.com/Gatech-Flash/huge/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pyhuge*"]

[tool.setuptools.package-data]
pyhuge = ["data/*.npz"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"

[tool.cibuildwheel]
build = "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
test-extras = ["test"]
test-sources = [
  "tests/test_native_smoke.py",
  "tests/test_native_symbols.py",
]
test-command = "pytest -q tests/test_native_smoke.py tests/test_native_symbols.py"

[tool.cibuildwheel.linux]
before-all = "dnf install -y openblas-devel"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
